<!DOCTYPE html>
<html>
<head>
    <title>論文生成器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>論文生成器</h1>
        <div class="input-section">
            <input type="text" id="topic" placeholder="請輸入研究主題">
            <button onclick="generatePaper()">生成論文</button>
        </div>
        
        <!-- 新增進度顯示區域 -->
        <div id="progress-section" style="display: none;">
            <div class="progress-bar">
                <div id="progress-indicator" style="width: 0%"></div>
            </div>
            <p id="progress-text">進度: 0%</p>
            <button id="continue-btn" onclick="continueGeneration()" style="display: none;">繼續迭代</button>
            <button id="stop-btn" onclick="stopGeneration()" style="display: none;">停止生成</button>
        </div>

        <div id="result" style="display: none;">
            <h3>論文已生成完成！</h3>
            <button id="download-btn" onclick="downloadPaper()">下載論文</button>
        </div>
    </div>

    <script>
    let currentFilename = '';
    let isGenerating = false;

    function generatePaper() {
        const topic = document.getElementById('topic').value;
        if (!topic) {
            alert('請輸入研究主題！');
            return;
        }

        isGenerating = true;
        document.getElementById('progress-section').style.display = 'block';
        document.getElementById('result').style.display = 'none';

        fetch('/generate', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ topic: topic })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                throw new Error(data.error);
            }
            currentFilename = data.filename;
            document.getElementById('result').style.display = 'block';
            isGenerating = false;
        })
        .catch(error => {
            alert('發生錯誤：' + error.message);
            isGenerating = false;
        });

        // 開始定期檢查進度
        checkProgress();
    }

    function checkProgress() {
        if (!isGenerating) return;

        fetch('/progress')
        .then(response => response.json())
        .then(data => {
            const progress = data.progress;
            document.getElementById('progress-indicator').style.width = `${progress}%`;
            document.getElementById('progress-text').textContent = `進度: ${progress}%`;

            // 當進度到達特定階段時（例如50%），顯示繼續按鈕
            if (progress >= 50 && progress < 100) {
                document.getElementById('continue-btn').style.display = 'inline-block';
                document.getElementById('stop-btn').style.display = 'inline-block';
            }

            if (progress < 100 && isGenerating) {
                setTimeout(checkProgress, 1000); // 每秒檢查一次進度
            }
        });
    }

    function continueGeneration() {
        // 在這裡可以加入繼續生成的邏輯
        document.getElementById('continue-btn').style.display = 'none';
    }

    function stopGeneration() {
        isGenerating = false;
        document.getElementById('continue-btn').style.display = 'none';
        document.getElementById('stop-btn').style.display = 'none';
    }

    function downloadPaper() {
        if (currentFilename) {
            window.location.href = `/download/${currentFilename}`;
        }
    }
    </script>
</body>
</html>
